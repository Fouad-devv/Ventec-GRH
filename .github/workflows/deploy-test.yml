name: Deploy — Test

on:
  push:
    branches: [deployTest]

jobs:
  deploy:
    name: Deploy to test environment
    # Runner installé sur la VM Ventec — pas besoin d'exposer la VM sur internet
    runs-on: self-hosted
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env file
        shell: powershell
        env:
          KC_USERNAME:              ${{ secrets.KC_USERNAME }}
          KC_PWD:                   ${{ secrets.KC_PWD }}
          KC_HOSTNAME:              ${{ secrets.KC_HOSTNAME }}
          KC_DB_USERNAME:           ${{ secrets.KC_DB_USERNAME }}
          KC_DB_PASSWORD:           ${{ secrets.KC_DB_PASSWORD }}
          DB_USERNAME:              ${{ secrets.DB_USERNAME }}
          DB_PASSWORD:              ${{ secrets.DB_PASSWORD }}
          APP_LOGIN_URL:            ${{ secrets.APP_LOGIN_URL }}
          KEYCLOAK_PUBLIC_URL:      ${{ secrets.KEYCLOAK_PUBLIC_URL }}
          KEYCLOAK_REALM:           ${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID:       ${{ secrets.KEYCLOAK_CLIENT_ID }}
          CORS_ALLOWED_ORIGINS:     ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SMTP_HOST:                ${{ secrets.SMTP_HOST }}
          SMTP_PORT:                ${{ secrets.SMTP_PORT }}
          SMTP_USER:                ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:            ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM:                ${{ secrets.MAIL_FROM }}
          IMAP_HOST:                ${{ secrets.IMAP_HOST }}
          IMAP_PORT:                ${{ secrets.IMAP_PORT }}
          IMAP_USER:                ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD:            ${{ secrets.IMAP_PASSWORD }}
          EMAIL_POLL_ENABLED:       ${{ secrets.EMAIL_POLL_ENABLED }}
          EMAIL_POLL_INTERVAL_MS:   ${{ secrets.EMAIL_POLL_INTERVAL_MS }}
          INIT_ADMIN_EMAIL:         ${{ secrets.INIT_ADMIN_EMAIL }}
          INIT_ADMIN_FIRSTNAME:     ${{ secrets.INIT_ADMIN_FIRSTNAME }}
          INIT_ADMIN_LASTNAME:      ${{ secrets.INIT_ADMIN_LASTNAME }}
          INIT_ADMIN_PASSWORD:      ${{ secrets.INIT_ADMIN_PASSWORD }}
          INIT_ADMIN_DEPARTMENT:    ${{ secrets.INIT_ADMIN_DEPARTMENT }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY2:            ${{ secrets.GROQ_API_KEY2 }}
          GROQ_API_KEY3:            ${{ secrets.GROQ_API_KEY3 }}
          GROQ_API_KEY4:            ${{ secrets.GROQ_API_KEY4 }}
          GROQ_API_KEY5:            ${{ secrets.GROQ_API_KEY5 }}
          GROQ_API_KEY6:            ${{ secrets.GROQ_API_KEY6 }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2:          ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3:          ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4:          ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5:          ${{ secrets.GEMINI_API_KEY5 }}
          GEMINI_API_KEY6:          ${{ secrets.GEMINI_API_KEY6 }}
          SAMBANOVA_API_KEY:        ${{ secrets.SAMBANOVA_API_KEY }}
          SAMBANOVA_API_KEY2:       ${{ secrets.SAMBANOVA_API_KEY2 }}
          SAMBANOVA_API_KEY3:       ${{ secrets.SAMBANOVA_API_KEY3 }}
          SAMBANOVA_API_KEY4:       ${{ secrets.SAMBANOVA_API_KEY4 }}
          SAMBANOVA_API_KEY5:       ${{ secrets.SAMBANOVA_API_KEY5 }}
          SAMBANOVA_API_KEY6:       ${{ secrets.SAMBANOVA_API_KEY6 }}
          VITE_KEYCLOAK_URL:        ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM:      ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID:  ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_API_URL:             ${{ secrets.VITE_API_URL }}
        run: |
          @"
          KC_USERNAME=$env:KC_USERNAME
          KC_PWD=$env:KC_PWD
          KC_HOSTNAME=$env:KC_HOSTNAME
          KC_DB_USERNAME=$env:KC_DB_USERNAME
          KC_DB_PASSWORD=$env:KC_DB_PASSWORD
          DB_USERNAME=$env:DB_USERNAME
          DB_PASSWORD=$env:DB_PASSWORD
          APP_LOGIN_URL=$env:APP_LOGIN_URL
          KEYCLOAK_PUBLIC_URL=$env:KEYCLOAK_PUBLIC_URL
          KEYCLOAK_REALM=$env:KEYCLOAK_REALM
          KEYCLOAK_CLIENT_ID=$env:KEYCLOAK_CLIENT_ID
          CORS_ALLOWED_ORIGINS=$env:CORS_ALLOWED_ORIGINS
          SMTP_HOST=$env:SMTP_HOST
          SMTP_PORT=$env:SMTP_PORT
          SMTP_USER=$env:SMTP_USER
          SMTP_PASSWORD=$env:SMTP_PASSWORD
          MAIL_FROM=$env:MAIL_FROM
          IMAP_HOST=$env:IMAP_HOST
          IMAP_PORT=$env:IMAP_PORT
          IMAP_USER=$env:IMAP_USER
          IMAP_PASSWORD=$env:IMAP_PASSWORD
          EMAIL_POLL_ENABLED=$env:EMAIL_POLL_ENABLED
          EMAIL_POLL_INTERVAL_MS=$env:EMAIL_POLL_INTERVAL_MS
          INIT_ADMIN_EMAIL=$env:INIT_ADMIN_EMAIL
          INIT_ADMIN_FIRSTNAME=$env:INIT_ADMIN_FIRSTNAME
          INIT_ADMIN_LASTNAME=$env:INIT_ADMIN_LASTNAME
          INIT_ADMIN_PASSWORD=$env:INIT_ADMIN_PASSWORD
          INIT_ADMIN_DEPARTMENT=$env:INIT_ADMIN_DEPARTMENT
          GROQ_API_KEY=$env:GROQ_API_KEY
          GROQ_API_KEY2=$env:GROQ_API_KEY2
          GROQ_API_KEY3=$env:GROQ_API_KEY3
          GROQ_API_KEY4=$env:GROQ_API_KEY4
          GROQ_API_KEY5=$env:GROQ_API_KEY5
          GROQ_API_KEY6=$env:GROQ_API_KEY6
          GEMINI_API_KEY=$env:GEMINI_API_KEY
          GEMINI_API_KEY2=$env:GEMINI_API_KEY2
          GEMINI_API_KEY3=$env:GEMINI_API_KEY3
          GEMINI_API_KEY4=$env:GEMINI_API_KEY4
          GEMINI_API_KEY5=$env:GEMINI_API_KEY5
          GEMINI_API_KEY6=$env:GEMINI_API_KEY6
          SAMBANOVA_API_KEY=$env:SAMBANOVA_API_KEY
          SAMBANOVA_API_KEY2=$env:SAMBANOVA_API_KEY2
          SAMBANOVA_API_KEY3=$env:SAMBANOVA_API_KEY3
          SAMBANOVA_API_KEY4=$env:SAMBANOVA_API_KEY4
          SAMBANOVA_API_KEY5=$env:SAMBANOVA_API_KEY5
          SAMBANOVA_API_KEY6=$env:SAMBANOVA_API_KEY6
          VITE_KEYCLOAK_URL=$env:VITE_KEYCLOAK_URL
          VITE_KEYCLOAK_REALM=$env:VITE_KEYCLOAK_REALM
          VITE_KEYCLOAK_CLIENT_ID=$env:VITE_KEYCLOAK_CLIENT_ID
          VITE_API_URL=$env:VITE_API_URL
          "@ | Set-Content -Encoding UTF8 .env

      - name: Copy TLS certificates
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path nginx\certs\test
          Copy-Item "C:\grh-certs\cert.pem" -Destination "nginx\certs\test\cert.pem"
          Copy-Item "C:\grh-certs\key.pem"  -Destination "nginx\certs\test\key.pem"

      - name: Build and restart containers
        shell: powershell
        run: docker compose -f docker-compose.test.yml -p grh-test up -d --build
