networks:
  grh-network:
    driver: bridge

services:

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: GRH-Ventec-keycloak
    command: start-dev --import-realm
    networks:
      - grh-network
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PWD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./grh-backend/grh-backend
      dockerfile: Dockerfile
    container_name: GRH-backend
    networks:
      - grh-network
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    ports:
      - "5000:5000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-GRH
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: GRH-frontend
    networks:
      - grh-network
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
