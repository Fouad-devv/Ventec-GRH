services:

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: GRH-Ventec-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      # auto-import the realm on first start
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # persist Keycloak data across restarts
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./grh-backend/grh-backend
      dockerfile: Dockerfile
    container_name: GRH-backend
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-GRH
      dockerfile: Dockerfile
    container_name: GRH-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keycloak_data:
