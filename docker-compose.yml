name: GRH-VENTEC

networks:
  grh-network:
    driver: bridge

services:

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: GRH-Ventec-keycloak
    command: start-dev --import-realm
    networks:
      - grh-network
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PWD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/GRH-VENTEC HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s

  # ── FastAPI AI service ──────────────────────────────────────────
  ai-service:
    build:
      context: ./FastAPI
      dockerfile: Dockerfile
    container_name: GRH-ai-service
    networks:
      - grh-network
    environment:
      BACKEND_URL: http://backend:5000/api
      MODEL_NAME: ${AI_MODEL_NAME}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./grh-backend/grh-backend
      dockerfile: Dockerfile
    container_name: GRH-backend
    networks:
      - grh-network
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KC_USERNAME: ${KC_USERNAME}
      KC_PWD: ${KC_PWD}
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_PATH: ${STORAGE_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    ports:
      - "5000:5000"
    depends_on:
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5000/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-GRH
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: GRH-frontend
    networks:
      - grh-network
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
