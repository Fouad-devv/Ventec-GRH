name: GRH-VENTEC

networks:
  grh-network:
    driver: bridge

services:

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: GRH-Ventec-keycloak
    command: start-dev --import-realm
    networks:
      - grh-network
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PWD}
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s

  # ── FastAPI AI service ──────────────────────────────────────────
  ai-service:
    build:
      context: ./FastAPI
      dockerfile: Dockerfile
    container_name: GRH-ai-service
    networks:
      - grh-network
    environment:
      BACKEND_URL: http://backend:5000/api
      AI_MODEL_NAME: ${AI_MODEL_NAME}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY2: ${GROQ_API_KEY2}
      GROQ_API_KEY3: ${GROQ_API_KEY3}
      GROQ_API_KEY4: ${GROQ_API_KEY4}
      GROQ_API_KEY5: ${GROQ_API_KEY5}
      GROQ_API_KEY6: ${GROQ_API_KEY6}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY2: ${GEMINI_API_KEY2}
      GEMINI_API_KEY3: ${GEMINI_API_KEY3}
      GEMINI_API_KEY4: ${GEMINI_API_KEY4}
      GEMINI_API_KEY5: ${GEMINI_API_KEY5}
      GEMINI_API_KEY6: ${GEMINI_API_KEY6}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY}
      SAMBANOVA_API_KEY2: ${SAMBANOVA_API_KEY2}
      SAMBANOVA_API_KEY3: ${SAMBANOVA_API_KEY3}
      SAMBANOVA_API_KEY4: ${SAMBANOVA_API_KEY4}
      SAMBANOVA_API_KEY5: ${SAMBANOVA_API_KEY5}
      SAMBANOVA_API_KEY6: ${SAMBANOVA_API_KEY6}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8000/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./grh-backend/grh-backend
      dockerfile: Dockerfile
    container_name: GRH-backend
    networks:
      - grh-network
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_PATH: ${STORAGE_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      EMAIL_POLL_ENABLED: ${EMAIL_POLL_ENABLED}
      EMAIL_POLL_INTERVAL_MS: ${EMAIL_POLL_INTERVAL_MS}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
      INIT_ADMIN_FIRSTNAME: ${INIT_ADMIN_FIRSTNAME}
      INIT_ADMIN_LASTNAME: ${INIT_ADMIN_LASTNAME}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      INIT_ADMIN_DEPARTMENT: ${INIT_ADMIN_DEPARTMENT}
    depends_on:
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5000/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-GRH
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: GRH-frontend
    networks:
      - grh-network
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx reverse proxy (TLS termination) ───────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: GRH-nginx
    networks:
      - grh-network
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/prod:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
