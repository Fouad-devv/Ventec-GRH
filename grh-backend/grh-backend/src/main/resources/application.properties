spring.application.name=grh-backend
spring.config.import=optional:file:../../.env[.properties]

# Server
server.port=5000
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — schema managed by Flyway, never by Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

# Keycloak Admin Client
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.username=${KC_USERNAME}
keycloak.admin.password=${KC_PWD}

# AI Service (FastAPI)
ai.service.url=${AI_SERVICE_URL}

# Local file storage (volume mount in Docker)
storage.path=${STORAGE_PATH}

# CORS — comma-separated list of allowed origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Public base URL (used for email image links)
app.base-url=${APP_BASE_URL:http://localhost:5000/api}
# Frontend login URL (used in welcome emails)
app.login-url=${APP_LOGIN_URL:http://localhost:5173}

# Mail SMTP
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
mail.from=${MAIL_FROM:noreply@ventec.ma}

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=50

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-http-form-post-size=-1
# Tomcat 10.1.20+ default is 50 parts — raise for bulk CV imports
server.tomcat.max-part-count=500

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.com.ventec=INFO

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# Inbound email — IMAP polling for auto-processing candidature emails
# Activate by setting EMAIL_POLL_ENABLED=true in .env
imap.host=${IMAP_HOST:imap.gmail.com}
imap.port=${IMAP_PORT:993}
imap.user=${IMAP_USER:}
imap.password=${IMAP_PASSWORD:}
email.poll.enabled=${EMAIL_POLL_ENABLED:false}
# Gmail IMAP is more stable with a slower polling cadence; 30s can trigger frequent BYE/timeouts.
email.poll.interval-ms=${EMAIL_POLL_INTERVAL_MS:300000}
