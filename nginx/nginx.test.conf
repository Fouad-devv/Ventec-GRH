events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Docker's internal DNS — forces re-resolution after 30s so nginx
    # picks up new container IPs after a partial rebuild
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── HTTP → HTTPS redirect (test) ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host:4443$request_uri;
    }

    # ── Main app — Test (Frontend + Backend API) ──────────────────────────────
    server {
        listen 4443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        # Frontend (React)
        location / {
            set $upstream_frontend http://frontend:80;
            proxy_pass         $upstream_frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Spring Boot backend API
        location /api/ {
            set $upstream_backend http://backend:5000;
            proxy_pass         $upstream_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ── Keycloak — Test ───────────────────────────────────────────────────────
    server {
        listen 9443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            set $upstream_keycloak http://keycloak:8080;
            proxy_pass              $upstream_keycloak;
            proxy_set_header        Host                $host;
            proxy_set_header        X-Real-IP           $remote_addr;
            proxy_set_header        X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto   https;
            proxy_set_header        X-Forwarded-Port    9443;
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
            proxy_read_timeout      300s;
        }
    }
}
