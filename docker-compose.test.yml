name: GRH-VENTEC-TEST

networks:
  grh-network-test:
    driver: bridge

services:

  # ── PostgreSQL — Keycloak ─────────────────────────────────────────
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: GRH-postgres-keycloak-test
    networks:
      - grh-network-test
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: keycloak_db
    volumes:
      - postgres_kc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PostgreSQL — Application ───────────────────────────────────────
  postgres-app:
    image: postgres:16-alpine
    container_name: GRH-postgres-app-test
    networks:
      - grh-network-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: grh_db
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Keycloak ────────────────────────────────────────────────────
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: GRH-Ventec-keycloak-test
    command: start --optimized --import-realm
    networks:
      - grh-network-test
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_PWD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/GRH-VENTEC HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 600s

  # ── FastAPI AI service ──────────────────────────────────────────
  ai-service:
    build:
      context: ./FastAPI
      dockerfile: Dockerfile
    container_name: GRH-ai-service-test
    networks:
      - grh-network-test
    environment:
      BACKEND_URL: http://backend:5000/api
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY2: ${GEMINI_API_KEY2}
      GEMINI_API_KEY3: ${GEMINI_API_KEY3}
      GEMINI_API_KEY4: ${GEMINI_API_KEY4}
      GEMINI_API_KEY5: ${GEMINI_API_KEY5}
      GEMINI_API_KEY6: ${GEMINI_API_KEY6}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY2: ${GROQ_API_KEY2}
      GROQ_API_KEY3: ${GROQ_API_KEY3}
      GROQ_API_KEY4: ${GROQ_API_KEY4}
      GROQ_API_KEY5: ${GROQ_API_KEY5}
      GROQ_API_KEY6: ${GROQ_API_KEY6}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY}
      SAMBANOVA_API_KEY2: ${SAMBANOVA_API_KEY2}
      SAMBANOVA_API_KEY3: ${SAMBANOVA_API_KEY3}
      SAMBANOVA_API_KEY4: ${SAMBANOVA_API_KEY4}
      SAMBANOVA_API_KEY5: ${SAMBANOVA_API_KEY5}
      SAMBANOVA_API_KEY6: ${SAMBANOVA_API_KEY6}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Spring Boot backend ─────────────────────────────────────────
  backend:
    build:
      context: ./grh-backend/grh-backend
      dockerfile: Dockerfile
    container_name: GRH-backend-test
    networks:
      - grh-network-test
    environment:
      DB_URL: jdbc:postgresql://postgres-app:5432/grh_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KC_USERNAME: ${KC_USERNAME}
      KC_PWD: ${KC_PWD}
      AI_SERVICE_URL: http://ai-service:8000
      STORAGE_PATH: /data/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_LOGIN_URL: ${APP_LOGIN_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      EMAIL_POLL_ENABLED: ${EMAIL_POLL_ENABLED}
      EMAIL_POLL_INTERVAL_MS: ${EMAIL_POLL_INTERVAL_MS}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
      INIT_ADMIN_FIRSTNAME: ${INIT_ADMIN_FIRSTNAME}
      INIT_ADMIN_LASTNAME: ${INIT_ADMIN_LASTNAME}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      INIT_ADMIN_DEPARTMENT: ${INIT_ADMIN_DEPARTMENT}
    volumes:
      - uploads_test:/data/uploads
    depends_on:
      postgres-app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5000/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── React frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./Front-GRH
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
    container_name: GRH-frontend-test
    networks:
      - grh-network-test
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx reverse proxy (TLS termination) ───────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: GRH-nginx-test
    networks:
      - grh-network-test
    ports:
      - "4480:80"
      - "4443:4443"
      - "9443:9443"
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs/test:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_test:
  postgres_app_data:
  postgres_kc_data:
