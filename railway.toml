# Railway configuration for the Keycloak service
# In Railway dashboard: Root Directory = "." | Dockerfile = "Dockerfile.keycloak"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.keycloak"

[deploy]
healthcheckPath = "/realms/master"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
